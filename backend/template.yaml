AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SolarSync FastAPI service packaged for AWS Lambda and API Gateway.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 120
    MemorySize: 2048

Resources:
  SolarSyncApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Environment:
        Variables:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          user: ""
          password: ""
          host: ""
          port: ""
          dbname: ""
          CORS_ALLOWED_ORIGINS: ""
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
