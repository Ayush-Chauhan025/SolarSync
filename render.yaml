services:
  - type: web
    name: solarsync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: user
        sync: false
      - key: password
        sync: false
      - key: host
        sync: false
      - key: port
        sync: false
      - key: dbname
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
